out_dir: /mnt/cagri/exps/results
metric_best: f1
seed: 18
wandb:
  use: True
  project: rev_3_collapse_rate
  save_dir: /mnt/cagri/exps/results
  name: April-2026 | ETH | PNA (collapse rate 0.25)
dataset:
  dir: /mnt/cagri/data
  format: ETH
  name: Kaggle
  reverse_mp: False
  add_ports: False
  collapse_rate: 0.25
  task: hetero_node
  task_type: classification
  task_entity: node
  transductive: True
  node_encoder: True
  node_encoder_name: Hetero_Raw
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Hetero_Raw
  edge_encoder_bn: False
num_threads: 8
num_workers: 2
train:
  mode: custom # custom
  sampler: hetero_neighbor
  neighbor_sizes: [100, 100]
  add_ego_id: False
  iter_per_epoch: 1024
  batch_size: 4096
  eval_period: 4
  ckpt_period: 25
  persistent_workers: True
  pin_memory: True
val:
  sampler: hetero_neighbor
  iter_per_epoch: -1 # 256 not used at the moment, traverse the entire dataset.
model:
  type: MegaGNNModel
  loss_fun: weighted_cross_entropy
  loss_fun_weight: [1, 3]
gnn:
  layer_type: PNA  # GINE, GenAgg, PNA
  act: relu
  dropout: 0.1  # local MP-GNN dropout
  input_dropout: 0.0
  layer_norm: False 
  batch_norm: True 
  edge_updates: True 
  multi_edge_agg: False
  multi_edge_agg_type: None
  layers_mp: 2
  dim_inner: 20 # dim_hidden
  head: default 
  layers_post_mp: 2
optim:
  batch_accumulation: 1
  clip_grad_norm: False
  clip_grad_norm_value: 2.0
  optimizer: adam
  weight_decay: 1e-5
  base_lr: 0.0008 
  max_epoch: 100
  scheduler: None
  num_warmup_epochs: 0
