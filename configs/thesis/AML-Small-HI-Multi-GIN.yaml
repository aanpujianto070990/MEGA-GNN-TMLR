# Thesis protocol, derived from configs/GIN/AML-Small-HI-Multi-GIN.yaml (model and optimizer settings unchanged):
# - one epoch = one full pass over the training seed edges (train.iter_per_epoch -1),
#   at most 20 epochs, validation evaluated every epoch;
# - model selection on validation F1, early stopping after 5 evaluations without
#   improvement, test evaluated once with the best checkpoint;
# - per-transaction scores saved for val (best epoch) and test.
# Seeds 1-10 are passed on the command line (seed <n>); out_dir and dataset.dir too.
out_dir: results
metric_best: f1
seed: 1
wandb:
  use: False
  project: neurips
  save_dir: results
dataset:
  dir: data
  format: AML
  name: Small-HI
  reverse_mp: True
  add_ports: True
  task: hetero_edge
  task_type: classification
  task_entity: ('node', 'to', 'node')
  transductive: True
  node_encoder: True
  node_encoder_name: Hetero_Raw
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: Hetero_Raw
  edge_encoder_bn: False
num_threads: 8
num_workers: 2
train:
  mode: custom # custom
  sampler: link_neighbor
  neighbor_sizes: [100, 100]
  add_ego_id: True
  iter_per_epoch: -1
  batch_size: 2048
  eval_period: 1
  test_at_best: True
  early_stop_patience: 5
  save_scores: True
  ckpt_period: 25
  persistent_workers: True
  pin_memory: True
val:
  sampler: link_neighbor
  iter_per_epoch: -1 # 256 not used at the moment, traverse the entire dataset.
model:
  type: MegaGNNModel
  loss_fun: weighted_cross_entropy
  loss_fun_weight: [1, 6.27]
gnn:
  layer_type: GINE  # GINE, GenAgg, PNA
  act: relu
  dropout: 0.1  # local MP-GNN dropout
  input_dropout: 0.0
  layer_norm: False 
  batch_norm: True 
  edge_updates: True 
  multi_edge_agg: False
  multi_edge_agg_type: None
  layers_mp: 2
  dim_inner: 64 # dim_hidden
  head: default 
  layers_post_mp: 2
optim:
  batch_accumulation: 4
  clip_grad_norm: False
  clip_grad_norm_value: 2.0
  optimizer: adam
  weight_decay: 1e-5
  base_lr: 0.003
  max_epoch: 20
  scheduler: None
  num_warmup_epochs: 5 
temporal:
  # Settings used when a run switches the module on (temporal.encoding / temporal.decay
  # on the command line, see thesis/plan.py). delta_t limited to a 2-day horizon
  # (decision 2026-10-29); Time2Vec periods start between 1 hour and 2 days.
  horizon_days: 2.0
  max_period_days: 2.0
